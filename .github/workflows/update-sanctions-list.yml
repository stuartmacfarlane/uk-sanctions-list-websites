name: Update UK Sanctions Website List

on:
  schedule:
    # Run every day at 04:17 UK time
    - cron: "17 4 * * *"
      timezone: "Europe/London"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sanctions-list
  cancel-in-progress: false

jobs:
  update:
    name: Update sanctions website feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sanctions website lists
        run: |
          python scripts/update.py

      # git diff does not show untracked files, so use git status here.
      # This means the first run will correctly detect the newly generated
      # urls.txt, domains.txt, mappings.csv and invalid.txt files.
      - name: Show generated file status
        run: |
          echo "Generated file status:"
          git status --short -- urls.txt domains.txt mappings.csv invalid.txt

          echo ""
          echo "Changes to already tracked files:"
          git diff --stat -- urls.txt domains.txt mappings.csv invalid.txt

      # Detect BOTH:
      #   - changes to existing tracked files
      #   - newly generated/untracked files
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- urls.txt domains.txt mappings.csv invalid.txt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sanctions website changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sanctions website changes detected."

            echo ""
            git status --short -- urls.txt domains.txt mappings.csv invalid.txt
          fi

      - name: Commit updated lists
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add urls.txt domains.txt mappings.csv invalid.txt

          git commit -m "Update UK sanctions website lists"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "UK sanctions website lists are already up to date."
