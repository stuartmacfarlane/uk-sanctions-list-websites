name: Update UK Sanctions Website List

on:
  schedule:
    # Run every day at 09:00 UK time
    - cron: "0 9 * * *"
      timezone: "Europe/London"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sanctions-list
  cancel-in-progress: false

jobs:
  update:
    name: Update sanctions website feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sanctions website list
        run: |
          python scripts/update.py

      - name: Show generated file status
        run: |
          echo "Generated file status:"
          git status --short -- urls.txt invalid.txt

          echo ""
          echo "Changes to already tracked files:"
          git diff --stat -- urls.txt invalid.txt

      # Detect both changes to existing files and newly generated files
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- urls.txt invalid.txt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sanctions website changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sanctions website changes detected."

            echo ""
            git status --short -- urls.txt invalid.txt
          fi

      - name: Commit updated lists
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add urls.txt invalid.txt

          git commit -m "Update UK sanctions website list"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "UK sanctions website list is already up to date."
