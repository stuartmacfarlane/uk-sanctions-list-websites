name: Update UK Sanctions Website List

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/London"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sanctions-list
  cancel-in-progress: false

jobs:
  update:
    name: Update sanctions website feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sanctions website lists
        run: |
          python scripts/update.py

      - name: Show changes
        run: |
          git diff --stat
          git diff -- urls.txt domains.txt mappings.csv invalid.txt

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- urls.txt domains.txt mappings.csv invalid.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sanctions website changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sanctions website changes detected."
          fi

      - name: Commit updated lists
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add urls.txt domains.txt mappings.csv invalid.txt

          git commit \
            -m "Update UK sanctions website lists"

          git push
